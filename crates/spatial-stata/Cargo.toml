[package]
name = "spatial-stata"
version = "0.2.0"
edition = "2021"
description = "Shared Stata SPI v3 Rust plugin for scpc-stata and spur-stata"
license = "MIT"

[lib]
name = "spatial_stata"
crate-type = ["staticlib", "rlib"]

[features]
sme2 = ["spatial-core/sme2"]

[dependencies]
spatial-core = { path = "../spatial-core" }
