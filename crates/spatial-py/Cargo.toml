[package]
name = "spatial-spur-rust"
version = "0.6.0"
edition = "2021"
description = "Native Python bindings for Spatial SPUR"
license = "MIT"

[lib]
name = "spatial_spur_rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py311"] }
numpy = "0.22"
spatial-core = { path = "../spatial-core" }
