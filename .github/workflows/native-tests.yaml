name: Native and installed packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            toolchain: stable
            features: ""
          - os: macos-latest
            toolchain: stable
            features: "--features spatial-core/portable"
          - os: ubuntu-latest
            toolchain: stable
            features: ""
          - os: ubuntu-latest
            toolchain: "1.85.0"
            features: ""
          - os: windows-latest
            toolchain: stable
            features: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo test --release --locked -p spatial-core -p spatial-stata ${{ matrix.features }}

  python-wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64
            manylinux: auto
          - os: macos-15-intel
            target: x86_64
            manylinux: auto
          - os: ubuntu-latest
            target: x86_64
            manylinux: "2_28"
          - os: windows-latest
            target: x86_64
            manylinux: auto
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Lint Python sources and tests
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install ruff
          ruff check python tests reference
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist
      - name: Check the Linux wheel policy
        if: runner.os == 'Linux'
        run: |
          python -m pip install auditwheel
          auditwheel show dist/*.whl
          ls dist/*manylinux_2_28*x86_64.whl
      - name: Run tests from an installed wheel with current dependencies
        run: |
          wheel=$(find "$GITHUB_WORKSPACE/dist" -name '*.whl' -print -quit)
          python -m pip install "$wheel[test,pyfixest]"
          cd "$RUNNER_TEMP"
          python -m pytest -q "$GITHUB_WORKSPACE/tests/python"
      - name: Run tests with minimum supported Statsmodels floor
        if: matrix.os == 'ubuntu-latest'
        run: |
          wheel=$(find "$GITHUB_WORKSPACE/dist" -name '*.whl' -print -quit)
          python -m venv "$RUNNER_TEMP/floor-venv"
          "$RUNNER_TEMP/floor-venv/bin/python" -m pip install \
            "$wheel[test]" "statsmodels==0.14.4" "pandas>=2.2,<3" "numpy<2.3"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/floor-venv/bin/python" -m pytest -q "$GITHUB_WORKSPACE/tests/python"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Run the same ABI3 wheel with Statsmodels alone
        run: |
          wheel=$(find "$GITHUB_WORKSPACE/dist" -name '*.whl' -print -quit)
          python -m pip install "$wheel[test]"
          cd "$RUNNER_TEMP"
          python -c "import importlib.util; assert importlib.util.find_spec('pyfixest') is None"
          python -m pytest -q "$GITHUB_WORKSPACE/tests/python"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  r-packages:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-vendor-filterer
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r/spatialSpur
      - name: Run spatial-r unit tests
        run: cargo test --release --locked -p spatial-r --lib
      - name: Build and offline-check CRAN R source archive
        run: |
          scripts/build_r_source.sh "$RUNNER_TEMP/source"
          r_tar=$(find "$RUNNER_TEMP/source" -name 'spatialSpur_*.tar.gz' -print -quit)
          mkdir -p "$RUNNER_TEMP/cargo-empty" "$RUNNER_TEMP/r-lib"
          cd "$RUNNER_TEMP"
          if [ "$RUNNER_OS" = "Linux" ]; then
            CARGO_HOME="$RUNNER_TEMP/cargo-empty" CARGO_NET_OFFLINE=true _R_CHECK_FORCE_SUGGESTS_=false \
              R CMD check --no-manual --as-cran "$r_tar"
            if grep -E "WARNING|ERROR" spatialSpur.Rcheck/00check.log; then
              echo "CRAN check reported errors or warnings" >&2
              exit 1
            fi
          else
            CARGO_HOME="$RUNNER_TEMP/cargo-empty" CARGO_NET_OFFLINE=true _R_CHECK_FORCE_SUGGESTS_=false \
              R CMD check --no-manual "$r_tar"
          fi
          CARGO_HOME="$RUNNER_TEMP/cargo-empty" CARGO_NET_OFFLINE=true \
            R CMD INSTALL -l "$RUNNER_TEMP/r-lib" "$r_tar"
          R_LIBS_USER="$RUNNER_TEMP/r-lib" Rscript "$GITHUB_WORKSPACE/scripts/check_r_library.R" spatialSpur
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: r-source-archive
          path: ${{ runner.temp }}/source/spatialSpur_*.tar.gz

  source-packages-and-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-vendor-filterer
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r/spatialSpur
      - name: Rebuild the Python source archive with its locked workspace
        run: |
          python -m pip install maturin
          maturin sdist --out "$RUNNER_TEMP/source"
          sdist=$(find "$RUNNER_TEMP/source" -name 'spatial_spur-*.tar.gz' -print -quit)
          mkdir -p "$RUNNER_TEMP/sdist-build"
          tar -xf "$sdist" -C "$RUNNER_TEMP/sdist-build" --strip-components=1
          cd "$RUNNER_TEMP/sdist-build"
          maturin build --release --locked --out "$RUNNER_TEMP/source"
          python -m pip install "$RUNNER_TEMP/source/"*.whl -r "$GITHUB_WORKSPACE/tests/python/requirements.lock"
          cd "$RUNNER_TEMP"
          python -m pytest -q "$GITHUB_WORKSPACE/tests/python"
      - name: Build R offline archive and verify Python+R parity
        run: |
          scripts/build_r_source.sh "$RUNNER_TEMP/source"
          r_tar=$(find "$RUNNER_TEMP/source" -name 'spatialSpur_*.tar.gz' -print -quit)
          mkdir -p "$RUNNER_TEMP/cargo-empty" "$RUNNER_TEMP/r-lib"
          CARGO_HOME="$RUNNER_TEMP/cargo-empty" CARGO_NET_OFFLINE=true \
            R CMD INSTALL -l "$RUNNER_TEMP/r-lib" "$r_tar"
          R_LIBS_USER="$RUNNER_TEMP/r-lib" python "$GITHUB_WORKSPACE/tests/parity/run.py" \
            --work "$RUNNER_TEMP/parity" --skip-stata --chetty
      - uses: actions/upload-artifact@v4
        with:
          name: source-archives
          path: ${{ runner.temp }}/source/*.tar.gz

  stata-link:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the Stata plugin and command bundle
        if: runner.os != 'Windows'
        run: |
          scripts/build_stata_bundle.sh "$RUNNER_TEMP/stata"
          plug="$RUNNER_TEMP/stata/spatial_spur.plugin"
          if [ "$RUNNER_OS" = "macOS" ]; then
            exports=$(nm -gU --defined-only "$plug" | awk '{print $NF}' | sort | tr '\n' ' ')
            test "$exports" = "_pginit _stata_call "
          else
            exports=$(nm -D --defined-only "$plug" | awk '{print $NF}' | sort | tr '\n' ' ')
            test "$exports" = "pginit stata_call "
          fi
      - name: Link the Windows Stata plugin
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./crates/spatial-stata/build_windows.ps1 -OutputDir (Join-Path $env:RUNNER_TEMP 'stata')
      - uses: actions/upload-artifact@v4
        with:
          name: stata-${{ matrix.os }}
          path: ${{ runner.temp }}/stata/*
