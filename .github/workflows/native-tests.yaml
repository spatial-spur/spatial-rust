name: Native tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            features: ''
          - os: macos-latest
            features: --features spatial-core/portable
          - os: ubuntu-latest
            features: ''
          - os: windows-latest
            features: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release --locked -p spatial-core -p spatial-stata ${{ matrix.features }}

  wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build and import the installed wheel
        env:
          MATURIN_PEP517_ARGS: --locked
        run: |
          uv venv
          uv build --wheel --out-dir dist crates/spatial-py
          uv pip install dist/*.whl
          uv run --no-project python -c "import spatial_spur_rust as native; assert native.build_info()['api_version'] == 7"

  stata-plugins:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fetch --locked
      - name: Link both Stata SPI plugins on Unix
        if: runner.os != 'Windows'
        run: make -C crates/spatial-stata PLUGIN_OUT="$RUNNER_TEMP/scpc_rust.plugin" SPUR_PLUGIN_OUT="$RUNNER_TEMP/spur_rust.plugin"
      - name: Link both Stata SPI plugins on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./crates/spatial-stata/build_windows.ps1 -OutputDir (Join-Path $env:RUNNER_TEMP 'stata-plugins')
