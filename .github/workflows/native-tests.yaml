name: Native and installed packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            features: ""
          - os: macos-latest
            features: "--features spatial-core/portable"
          - os: ubuntu-latest
            features: ""
          - os: windows-latest
            features: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release --locked -p spatial-core -p spatial-stata ${{ matrix.features }}

  python-wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64
            manylinux: auto
          - os: macos-15-intel
            target: x86_64
            manylinux: auto
          - os: ubuntu-latest
            target: x86_64
            manylinux: "2_28"
          - os: windows-latest
            target: x86_64
            manylinux: auto
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist
      - name: Check the Linux wheel policy
        if: runner.os == 'Linux'
        run: |
          python -m pip install auditwheel
          auditwheel show dist/*.whl
          ls dist/*manylinux_2_28*x86_64.whl
      - name: Run tests from an installed wheel with current dependencies
        run: |
          wheel=$(find "$GITHUB_WORKSPACE/dist" -name '*.whl' -print -quit)
          python -m pip install "$wheel[test,pyfixest]"
          cd "$RUNNER_TEMP"
          python -m pytest -q "$GITHUB_WORKSPACE/tests/python"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Run the same ABI3 wheel with Statsmodels alone
        run: |
          wheel=$(find "$GITHUB_WORKSPACE/dist" -name '*.whl' -print -quit)
          python -m pip install "$wheel[test]"
          cd "$RUNNER_TEMP"
          python -c "import importlib.util; assert importlib.util.find_spec('pyfixest') is None"
          python -m pytest -q "$GITHUB_WORKSPACE/tests/python"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  source-packages:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r/spatialSpur
      - name: Rebuild the Python source archive with its locked workspace
        run: |
          python -m pip install maturin
          maturin sdist --out "$RUNNER_TEMP/source"
          tar -xf "$RUNNER_TEMP/source/spatial_spur-0.6.0.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/spatial_spur-0.6.0"
          maturin build --release --locked --out "$RUNNER_TEMP/source"
          python -m pip install "$RUNNER_TEMP/source/"*.whl -r "$GITHUB_WORKSPACE/tests/python/requirements.lock"
          cd "$RUNNER_TEMP"
          python -m pytest -q "$GITHUB_WORKSPACE/tests/python"
      - name: Compile and check the R archive without a Cargo cache
        run: |
          scripts/build_r_source.sh "$RUNNER_TEMP/source"
          mkdir "$RUNNER_TEMP/cargo-empty"
          cd "$RUNNER_TEMP"
          CARGO_HOME="$RUNNER_TEMP/cargo-empty" CARGO_NET_OFFLINE=true \
            R CMD check --no-manual source/spatialSpur_0.6.0.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: source-archives
          path: ${{ runner.temp }}/source/*.tar.gz

  stata-link:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the Stata plugin and command bundle
        if: runner.os != 'Windows'
        run: |
          scripts/build_stata_bundle.sh "$RUNNER_TEMP/stata"
          plug="$RUNNER_TEMP/stata/spatial_spur.plugin"
          if [ "$RUNNER_OS" = "macOS" ]; then
            exports=$(nm -gU --defined-only "$plug" | awk '{print $NF}' | sort | tr '\n' ' ')
            test "$exports" = "_pginit _stata_call "
          else
            exports=$(nm -D --defined-only "$plug" | awk '{print $NF}' | sort | tr '\n' ' ')
            test "$exports" = "pginit stata_call "
          fi
      - name: Link the Windows Stata plugin
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./crates/spatial-stata/build_windows.ps1 -OutputDir (Join-Path $env:RUNNER_TEMP 'stata')
